services:
  postgres:
    image: postgres:16
    container_name: zigma_aida_postgres
    environment:
      POSTGRES_USER: aida
      POSTGRES_PASSWORD: aida
      POSTGRES_DB: aida
    ports:
      - "5432:5432"
    volumes:
      - zigma_aida_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aida -d aida"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The backend: Node + pg + the generated code (built on the host into
  # backend/, see backend/Dockerfile). No long-running process yet (there is
  # no HTTP layer): backend code runs on demand with
  # `docker compose run --rm backend node ...`, reaching Postgres by its
  # service name.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://aida:aida@postgres:5432/aida
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zigma_aida_pgdata:
