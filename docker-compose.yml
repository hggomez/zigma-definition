services:
  postgres:
    image: postgres:16
    container_name: zigma_aida_postgres
    environment:
      POSTGRES_USER: aida
      POSTGRES_PASSWORD: aida
      POSTGRES_DB: aida
    ports:
      - "5432:5432"
    volumes:
      - zigma_aida_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aida -d aida"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  zigma_aida_pgdata:
