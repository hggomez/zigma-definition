# The names of the stack come from the system: SYSTEM_NAME is read from .env,
# which `zig build` writes from the system's `name` (`generate env`) before
# any compose step. Without it compose stops with the message below.
x-system-name: &system-name ${SYSTEM_NAME:?no SYSTEM_NAME - run a zig build step first, it writes .env}

services:
  postgres:
    image: postgres:16
    container_name: zigma_${SYSTEM_NAME}_postgres
    environment:
      POSTGRES_USER: *system-name
      POSTGRES_PASSWORD: *system-name
      POSTGRES_DB: *system-name
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYSTEM_NAME} -d ${SYSTEM_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The backend: Node + pg + the generated code (built on the host into
  # backend/, see backend/Dockerfile). Its long-running process is the
  # generated HTTP server (src/server.ts), published on port 3000; it reaches
  # Postgres by its service name. Other backend code can still run on demand
  # with `docker compose run --rm backend node ...` (run replaces the command).
  backend:
    build: ./backend
    command: ["node", "src/server.ts"]
    environment:
      DATABASE_URL: postgres://${SYSTEM_NAME}:${SYSTEM_NAME}@postgres:5432/${SYSTEM_NAME}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # healthy once the server answers anything (a 404 too): it does not depend
    # on any entity of the system
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The frontend: nginx serving the pages generated from the SSOT (built on
  # the host into frontend/public, see frontend/Dockerfile) on port 8080, and
  # proxying /api to the backend.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The end-to-end tests of the frontend: Playwright with its browsers (see
  # e2e/Dockerfile), reaching the frontend by its service name. Not started by
  # `docker compose up` (profile e2e): run with `docker compose run --rm e2e`.
  e2e:
    build: ./e2e
    environment:
      BASE_URL: http://frontend
    profiles: ["e2e"]

# A key is not interpolated, so the system's name goes in `name`; with the
# project in front, as compose names a volume by default, each project (the
# test stack, zigma-example) keeps its own.
volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME}_zigma_${SYSTEM_NAME}_pgdata
