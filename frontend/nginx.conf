# The API is the backend's, under /api (same origin for the browser: no
# CORS); every other path is a generated page, its URL mirroring the API's
# (/docentes is docentes.html, showing what /api/docentes returns).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
